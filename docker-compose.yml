services:

    postgres:
        image: postgis/postgis:16-3.4-alpine
        container_name: postgresSC
        restart: unless-stopped
        volumes:
            - postgres_data:/var/lib/postgresql/data   
        environment:
            POSTGRES_DB: sportconnectdb
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d sportconnectdb"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 5s
        
    redis:
        image: redis:7-alpine
        container_name: redisSC
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    api:
        build:
            context: .
            dockerfile: SportConnect.API/Dockerfile
        container_name: sportconnect-api
        restart: unless-stopped
        environment:
            ConnectionStrings__SportConnectConnection: "Host=postgres;Port=5432;Database=sportconnectdb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
            ConnectionStrings__Redis: "redis:6379"
            Jwt__Key: ${JWT_KEY}
            Jwt__Issuer: ${JWT_ISSUER}
            Jwt__Audience: ${JWT_AUDIENCE}
            Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - "8080:8080"
        volumes:
            - ./logs:/app/logs

    frontend:
        build:
            context: ./sportconnect-client
            dockerfile: Dockerfile
        container_name: sportconnect-frontend
        restart: unless-stopped
        depends_on:
            - api
        ports:
            - "3000:80"
      
    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: pgadmin
        restart: unless-stopped
        volumes:
            - pgadmin_working_dir:/var/lib/pgadmin
            - pgadmin_config_dir:/pgadmin4 
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
        depends_on:
            postgres:
                condition: service_healthy
        ports:
            - "5050:80" 
volumes:
    postgres_data:
    redis_data:
    pgadmin_working_dir:
    pgadmin_config_dir:
